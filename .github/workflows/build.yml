name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Keep the Gradle download cached on this branch too.
          cache-read-only: false

      # The Gradle download sometimes times out on GitHub's side; try a few times.
      - name: Download Gradle
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --no-daemon --version && exit 0
            echo "Download failed, retrying ($i)"
            sleep $((i * 20))
          done
          exit 1

      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk knight-ime.apk

      - uses: actions/upload-artifact@v4
        with:
          name: knight-ime
          path: knight-ime.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest knight-ime.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Knight 输入法 · 最新构建 #${{ github.run_number }}" \
            --notes "分支 ${{ github.ref_name }}，提交 ${{ github.sha }}。下载 knight-ime.apk 安装即可，新版本可直接覆盖安装。"
